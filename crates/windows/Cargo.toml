[package]
name = "rustgfw-windows"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_os = "windows")'.dependencies]
rustgfw-core = { path = "../core" }
libloading = "0.9.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Rpc"] }
