[package]
name = "rustgfw"
version = "0.1.0"
edition = "2024"

[dependencies]
rustgfw-core = { path = "crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustgfw-linux = { path = "crates/linux" }
signal-hook = "0.3"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
rustgfw-windows = { path = "crates/windows" }

[workspace]
members = ["crates/core", "crates/linux", "crates/windows"]
exclude = ["vendor/nfq"]
resolver = "3"

[patch.crates-io]
nfq = { path = "vendor/nfq" }
